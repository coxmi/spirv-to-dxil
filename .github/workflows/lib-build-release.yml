name: lib build release

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      tag:
        type: string
        default: dev
      mode:
        type: string
        default: ReleaseFast

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-windows-gnu
          - aarch64-windows-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2

      - name: build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=${{ inputs.mode }}

      - name: package
        if: inputs.publish
        env:
          TAG: ${{ inputs.tag }}
        run: |
          NAME="spirv_to_dxil-${TAG#v}-${{ matrix.target }}"
          mkdir -p "${NAME}/lib" "${NAME}/include"
          cp zig-out/lib/* "${NAME}/lib/"
          cp zig-out/include/*.h "${NAME}/include/"
          tar czf "${NAME}.tar.gz" "${NAME}/"

      - name: upload artifact
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: spirv_to_dxil-${{ matrix.target }}
          path: spirv_to_dxil-*.tar.gz

  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*.tar.gz