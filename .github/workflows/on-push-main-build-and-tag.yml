name: main

on:
  push:
    branches: [main]

jobs:
  build:
    uses: ./.github/workflows/lib-build-release.yml
    with:
      mode: ReleaseFast
      publish: false

  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: check mesa version
        id: bump
        run: |
          if git diff --quiet HEAD~1 HEAD -- mesa/.vendored-version; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: push tag
        if: steps.bump.outputs.changed == 'true'
        run: |
          TAG="v$(cat mesa/.vendored-version)"
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "tag ${TAG} already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"